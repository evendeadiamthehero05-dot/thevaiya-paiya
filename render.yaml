services:
  - type: web
    name: thevaiya-paiya-frontend
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_BACKEND_URL
        value: https://thevaiya-paiya-backend.onrender.com
        sync: false
    dir: ./frontend

  - type: web
    name: thevaiya-paiya-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: FRONTEND_URL
        value: https://thevaiya-paiya-frontend.onrender.com
        sync: false
      - key: CORS_ORIGIN
        value: https://thevaiya-paiya-frontend.onrender.com
        sync: false
